# Broad Saudi retail seed catalog. Final category comes from the Amazon product page
# breadcrumb, not from these labels. Edit this file to focus on specific categories.
max_pages_per_query: 6
sorts:
  - featured
  - bestsellers
  - average_review
  - price_low_to_high
  - price_high_to_low

categories:
